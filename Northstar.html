<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar — Internal Operations</title>
    <style>
      :root {
        --ink: #172b24;
        --muted: #718078;
        --canvas: #f5f4ef;
        --surface: #ffffff;
        --line: #e6e7df;
        --lime: #c9f36a;
        --mint: #e7f7d8;
        --aqua: #d6f2eb;
        --peach: #fff0d6;
        --red: #d64f3b;
        --shadow: 0 1px 2px rgba(24, 43, 35, 0.04), 0 10px 32px rgba(24, 43, 35, 0.035);
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      .app { min-height: 100vh; display: grid; grid-template-columns: 232px 1fr; }

      .sidebar { border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; background: #f8f8f4; }
      .logo { padding: 0 10px 28px; display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.05em; font-size: 21px; }
      .logo-mark { width: 25px; height: 25px; border-radius: 8px 8px 8px 2px; background: var(--ink); position: relative; }
      .logo-mark::after { content: ""; width: 9px; height: 9px; background: var(--lime); position: absolute; right: 4px; bottom: 4px; border-radius: 50% 50% 2px 50%; }
      .workspace { padding: 11px 10px 18px; }
      .workspace-label, .nav-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 800; }
      .workspace-switch { margin-top: 9px; padding: 9px; background: #eef0e9; border: 1px solid #e1e4dc; border-radius: 9px; display: flex; align-items: center; justify-content: space-between; font-weight: 650; }
      .nav-label { padding: 7px 10px; display: block; }
      .nav { display: grid; gap: 2px; }
      .nav button { width: 100%; border: 0; color: #536159; background: transparent; text-align: left; border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
      .nav button:hover { background: #eef0e9; color: var(--ink); }
      .nav button.active { color: var(--ink); background: var(--mint); font-weight: 700; }
      .nav-icon { width: 17px; display: inline-grid; place-items: center; font-size: 16px; }
      .nav-count { margin-left: auto; padding: 1px 7px; border-radius: 999px; background: #fff; color: #617067; font-size: 11px; font-weight: 800; }
      .user { margin-top: auto; border-top: 1px solid var(--line); padding: 16px 8px 2px; display: flex; align-items: center; gap: 9px; }
      .avatar { height: 31px; width: 31px; display: inline-grid; place-items: center; border-radius: 50%; background: #d9e8db; color: #27533d; font-size: 11px; font-weight: 800; flex: none; }
      .user-name { font-size: 12px; font-weight: 800; }
      .user-role { font-size: 11px; color: var(--muted); }
      .more { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 18px; }

      .content { min-width: 0; }
      .topbar { height: 72px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.55); padding: 0 34px; display: flex; align-items: center; gap: 22px; }
      .crumb { color: var(--muted); font-size: 13px; }
      .crumb strong { color: var(--ink); }
      .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      .help, .icon-button { width: 34px; height: 34px; display: grid; place-items: center; color: #536159; background: transparent; border: 1px solid transparent; border-radius: 8px; }
      .icon-button:hover, .help:hover { background: #fff; border-color: var(--line); }
      .date { color: var(--muted); font-size: 12px; padding-right: 7px; border-right: 1px solid var(--line); }
      .notify { position: relative; }
      .notify::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--red); top: 7px; right: 8px; border: 1px solid #fff; }

      main { max-width: 1510px; padding: 34px; margin: auto; }
      .page-heading { display: flex; gap: 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 27px; }
      h1 { margin: 0; font-size: clamp(28px, 3vw, 36px); line-height: 1.05; letter-spacing: -0.055em; }
      .eyebrow { margin: 0 0 8px; text-transform: uppercase; letter-spacing: .13em; color: #63825e; font-size: 10px; font-weight: 800; }
      .subtitle { margin: 9px 0 0; color: var(--muted); }
      .button-row { display: flex; gap: 8px; align-items: center; }
      .btn { padding: 9px 13px; border-radius: 8px; border: 1px solid var(--line); background: white; color: var(--ink); font-weight: 750; font-size: 12px; white-space: nowrap; }
      .btn:hover { border-color: #aeb9ae; background: #fafcf8; }
      .btn-primary { border-color: var(--ink); background: var(--ink); color: white; box-shadow: 0 3px 0 #28483a; }
      .btn-primary:hover { background: #28483a; }
      .btn-small { padding: 6px 10px; font-size: 11px; }

      .metrics { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 25px; }
      .metric { padding: 17px 19px; border-right: 1px solid var(--line); }
      .metric:last-child { border-right: 0; }
      .metric-label { color: var(--muted); font-weight: 650; font-size: 12px; display: flex; justify-content: space-between; }
      .metric-value { font-size: 27px; font-weight: 800; letter-spacing: -.05em; margin: 4px 0; }
      .delta { font-size: 11px; color: #418253; font-weight: 750; }
      .delta.neutral { color: #9d772c; }
      .delta.red { color: var(--red); }

      .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 23px; align-items: start; }
      .panel { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
      .panel-header { padding: 17px 19px; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid var(--line); }
      .panel-header h2 { margin: 0; letter-spacing: -.035em; font-size: 15px; }
      .panel-header .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
      .queue-controls { padding: 14px 19px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
      .search { position: relative; flex: 1; }
      .search span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
      .search input { width: 100%; border: 1px solid var(--line); height: 35px; padding: 0 10px 0 31px; border-radius: 7px; outline: none; color: var(--ink); background: #fafbf9; font-size: 12px; }
      .search input:focus { border-color: #8aad70; box-shadow: 0 0 0 3px var(--mint); }
      .filter-btn { background: #fff; height: 35px; border: 1px solid var(--line); border-radius: 7px; padding: 0 10px; color: #5e6b62; font-size: 12px; font-weight: 700; }
      .tabs { display: flex; align-items: center; padding: 0 19px; border-bottom: 1px solid var(--line); gap: 20px; }
      .tab { padding: 13px 1px 10px; color: var(--muted); border: 0; border-bottom: 2px solid transparent; background: transparent; font-size: 12px; font-weight: 750; }
      .tab.active { color: var(--ink); border-color: var(--ink); }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th { text-align: left; padding: 10px 14px; color: var(--muted); font-size: 10px; letter-spacing: .09em; text-transform: uppercase; background: #fbfcf9; font-weight: 800; white-space: nowrap; }
